name: Build SANTRAM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - run: unzip -q santram-source.zip

      - name: Build APK
        working-directory: SANTRAM_9999999999999X_Android_MVP
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SANTRAM-9999999999999X-debug-apk
          path: SANTRAM_9999999999999X_Android_MVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
